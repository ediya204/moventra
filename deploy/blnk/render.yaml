# Standalone private Blnk infrastructure; managed independently of the app.
# Share the existing PostgreSQL instance, but use a separate logical database.
services:
  - type: pserv
    name: moventra-blnk
    runtime: image
    image:
      url: docker.io/jerryenebeli/blnk:0.15.4@sha256:741665b0d7d5a1c6dc0a989aacf249c05637c52dcf96163c67f9d7a7010ec22d
    region: singapore
    plan: starter
    autoDeployTrigger: off
    numInstances: 1
    dockerCommand: blnk start
    envVars:
      - key: BLNK_DATA_SOURCE_DNS
        sync: false
      - key: BLNK_REDIS_DNS
        fromService:
          type: keyvalue
          name: moventra-blnk-redis
          property: connectionString
      - key: BLNK_SERVER_SECRET_KEY
        sync: false
      - key: BLNK_METRICS_BEARER_TOKEN
        sync: false
      - key: BLNK_SERVER_SECURE
        value: "true"
      - key: BLNK_SERVER_PORT
        value: "5001"
      - key: BLNK_DATABASE_MAX_OPEN_CONNS
        value: "10"
      - key: BLNK_DATABASE_MAX_IDLE_CONNS
        value: "5"
      - key: BLNK_REDIS_POOL_SIZE
        value: "10"
      - key: BLNK_REDIS_MIN_IDLE_CONNS
        value: "2"
      - key: BLNK_ENABLE_TELEMETRY
        value: "false"
    # Initial migration is a one-time pre-deploy command, cleared after success.
  - type: keyvalue
    name: moventra-blnk-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []
# Reuse existing moventra-postgres (dpg-daepg09t0dsc73b7q55g-a).
# Provision logical database moventra_blnk and restricted login moventra_blnk
# inside that instance. Do not create another billed Postgres instance.
